# Browser service (browser/Dockerfile, yggdrasil.browser): real Google Chrome, headed under Xvfb, for read_url's
# browser tier (YGG_BROWSER_URL). patchright keeps one warm profile; nodriver starts a fresh Chrome per escalation.
# Pages are untrusted: every request is SSRF-checked in the service, and networkpolicy.yaml keeps the pod off the
# cluster and the LAN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yggdrasil-browser
  labels:
    app.kubernetes.io/name: yggdrasil-browser
    app.kubernetes.io/part-of: yggdrasil
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yggdrasil-browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yggdrasil-browser
        app.kubernetes.io/component: browser
        app.kubernetes.io/part-of: yggdrasil
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: browser
          image: yggdrasil-browser
          imagePullPolicy: IfNotPresent
          env:
            # Match the node's egress location so the browser timezone agrees with its IP.
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Chrome profiles (the warm one persists until the pod restarts), the Xvfb socket, font caches.
            - name: tmp
              mountPath: /tmp
            # Chrome needs a large /dev/shm; the default 64Mi crashes tabs.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: yggdrasil-browser
  labels:
    app.kubernetes.io/part-of: yggdrasil
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: yggdrasil-browser
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
