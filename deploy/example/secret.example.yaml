# NOT part of kustomization.yaml: a template. Fill it in and apply it once, seal it (kubeseal), or create the
# same keys with your secret manager. Never commit the filled-in file.
#
#   kubectl -n yggdrasil create secret generic yggdrasil-secrets \
#     --from-literal=ONEBOT_ACCESS_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=YGG_SECRET_KEY="$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
apiVersion: v1
kind: Secret
metadata:
  name: yggdrasil-secrets
  namespace: yggdrasil
type: Opaque
stringData:
  # Shared with the OneBot endpoint (snowluma.yaml writes it into SnowLuma's reverse WebSocket config).
  ONEBOT_ACCESS_TOKEN: change-me
  # Fernet key that encrypts provider API keys in the database. Back it up: losing or changing it makes
  # every stored API key unreadable (you would re-enter them in the dashboard).
  YGG_SECRET_KEY: change-me
  # searxng.yaml only: openssl rand -hex 32
  # SEARXNG_SECRET: change-me
  # sandbox component only: bearer token for sandboxd in the workspace pods. Its sha256 hex digest goes into
  # --auth-token-sha256 in sandbox/sandbox.yaml:  printf %s "$TOKEN" | sha256sum
  # YGG_SANDBOX_TOKEN: change-me
