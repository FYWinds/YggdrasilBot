name: GHCR Cleanup

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Multi-arch aware: never deletes children still referenced by a kept tag.
      - name: Clean up sha-* images and untagged manifests
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep in sync with the images pushed by ci.yaml (IMAGE/SANDBOX_IMAGE/RENDER_IMAGE/BROWSER_IMAGE).
          packages: yggdrasil-bot,yggdrasil-sandbox,yggdrasil-render,yggdrasil-browser
          delete-tags: "sha-*"
          exclude-tags: "main"
          keep-n-tagged: 5
          delete-untagged: true
          validate: true
