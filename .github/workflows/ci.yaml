name: CI

# Releases are git tags, one namespace per image (one commit may carry several):
#   vX.Y.Z          bot           -> ghcr.io/fywinds/yggdrasil-bot:vX.Y.Z
#   sandbox-vX.Y.Z  sandbox image -> ghcr.io/fywinds/yggdrasil-sandbox:vX.Y.Z
#   render-vX.Y.Z   render image  -> ghcr.io/fywinds/yggdrasil-render:vX.Y.Z
#   browser-vX.Y.Z  browser image -> ghcr.io/fywinds/yggdrasil-browser:vX.Y.Z
# Each image is versioned on its own; argocd-image-updater follows each image's newest vX.Y.Z. Pushes to main build
# only the bot (sha-* / main tags for manual pins).
on:
  push:
    branches: [main]
    tags: ["v*", "sandbox-v*", "render-v*", "browser-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fywinds/yggdrasil-bot
  SANDBOX_IMAGE: ghcr.io/fywinds/yggdrasil-sandbox
  RENDER_IMAGE: ghcr.io/fywinds/yggdrasil-render
  BROWSER_IMAGE: ghcr.io/fywinds/yggdrasil-browser

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.26.0-pg18
        env:
          POSTGRES_USER: ygg
          POSTGRES_PASSWORD: ygg
          POSTGRES_DB: ygg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ygg" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run basedpyright
      - name: Tests
        run: |
          export YGG_SECRET_KEY="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          uv run alembic upgrade head
          uv run pytest -q

  bot:
    needs: check
    # Branch pushes, manual runs and vX.Y.Z tags; not the sandbox-/render-/browser- release tags.
    if: github.event_name != 'pull_request' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # vX.Y.Z is what argocd-image-updater deploys; sha-* and main are for manual pins.
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # vX.Y.Z on tags, otherwise the branch/sha tag; lands in telemetry service.version.
          build-args: YGG_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  # Sandbox workspace image (sandbox/), only on sandbox-vX.Y.Z tags. The tests that need a real sandboxd (in-sandbox
  # helpers, backend conformance) run here against this commit's image instead of on every push: the image only
  # changes with these tags, and the bot-side sandbox tests use an in-memory sandboxd.
  sandbox:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sandbox-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@v3
      # Target `sandboxd-test`: sandboxd, Python + ipykernel and the /opt/ygg helpers.
      - name: Build sandbox test image
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/Dockerfile
          target: sandboxd-test
          load: true
          tags: ygg-sbx-test:ci
          cache-from: type=gha,scope=sandboxd-test
          cache-to: type=gha,mode=max,scope=sandboxd-test
      - name: Test against sandboxd
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          digest="$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)"
          docker run -d --name ygg-sbx-test -p 127.0.0.1:18080:8080 -p 127.0.0.1:19090:9090 \
            ygg-sbx-test:ci --root-dir=/workspace "--auth-token-sha256=$digest"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/v1/health && break
            sleep 1
          done
          export YGG_TEST_SANDBOXD_REST=http://127.0.0.1:18080 YGG_TEST_SANDBOXD_GRPC=127.0.0.1:19090
          export YGG_TEST_SANDBOXD_TOKEN="$token"
          export YGG_SECRET_KEY="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          uv run pytest -q tests/sandbox/test_helpers_*.py tests/sandbox/test_sandbox_conformance.py
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SANDBOX_IMAGE }}
          tags: |
            type=match,pattern=^sandbox-(v\d+\.\d+\.\d+)$,group=1
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

  # Render service image (render/: Markdown/Mermaid/HTML to PNG for the render_* tools), only on render-vX.Y.Z tags.
  render:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/render-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RENDER_IMAGE }}
          tags: |
            type=match,pattern=^render-(v\d+\.\d+\.\d+)$,group=1
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: render
          file: render/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=render
          cache-to: type=gha,mode=max,scope=render

  # Browser service image (browser/Dockerfile: real Chrome for read_url's browser tier), only on browser-vX.Y.Z
  # tags. Built from the repository root: it copies yggdrasil/browser and the SSRF guard.
  browser:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/browser-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BROWSER_IMAGE }}
          tags: |
            type=match,pattern=^browser-(v\d+\.\d+\.\d+)$,group=1
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: browser/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser
