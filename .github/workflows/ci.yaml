name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fywinds/yggdrasil-bot
  SANDBOX_IMAGE: ghcr.io/fywinds/yggdrasil-sandbox

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.26.0-pg18
        env:
          POSTGRES_USER: ygg
          POSTGRES_PASSWORD: ygg
          POSTGRES_DB: ygg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ygg" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Minimal sandboxd (target `sandboxd` of sandbox/Dockerfile) for the sandbox conformance tests.
      - name: Build sandboxd test image
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/Dockerfile
          target: sandboxd
          load: true
          tags: ygg-sandboxd-test:ci
          cache-from: type=gha,scope=sandboxd
          cache-to: type=gha,mode=max,scope=sandboxd
      - name: Start sandboxd
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          digest="$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)"
          docker run -d --name ygg-sandboxd-test -p 127.0.0.1:18080:8080 -p 127.0.0.1:19090:9090 \
            ygg-sandboxd-test:ci --root-dir=/workspace "--auth-token-sha256=$digest"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/v1/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/v1/health
          {
            echo "YGG_TEST_SANDBOXD_REST=http://127.0.0.1:18080"
            echo "YGG_TEST_SANDBOXD_GRPC=127.0.0.1:19090"
            echo "YGG_TEST_SANDBOXD_TOKEN=$token"
          } >> "$GITHUB_ENV"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run basedpyright
      - name: Tests
        run: |
          export YGG_SECRET_KEY="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          uv run alembic upgrade head
          uv run pytest -q

  build-and-push:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # vX.Y.Z is what argocd-image-updater deploys; sha-* and main are for manual pins.
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # vX.Y.Z on tags, otherwise the branch/sha tag; lands in telemetry service.version.
          build-args: YGG_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      # Sandbox workspace image; shares the bot's tags so a release pins both.
      - name: Sandbox metadata
        id: sandbox-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SANDBOX_IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push sandbox
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/Dockerfile
          push: true
          tags: ${{ steps.sandbox-meta.outputs.tags }}
          labels: ${{ steps.sandbox-meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
